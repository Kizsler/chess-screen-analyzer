<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Oracle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #D4AF37;
            --gold-light: #F4E4BC;
            --gold-dark: #996515;
            --wood-dark: #1a1410;
            --wood-medium: #2d241c;
            --wood-light: #3d3128;
            --ivory: #FFFEF9;
            --ivory-dim: #E8E6DF;
            --obsidian: #0d0b09;
            --success: #7CB342;
            --danger: #E57373;
            --square-light: #F0D9B5;
            --square-dark: #B58863;
            --highlight-from: rgba(255, 255, 0, 0.5);
            --highlight-to: rgba(0, 255, 0, 0.5);
        }

        body {
            font-family: 'Cormorant Garamond', Georgia, serif;
            background: var(--obsidian);
            color: var(--ivory);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 2px,
                    rgba(212, 175, 55, 0.02) 2px,
                    rgba(212, 175, 55, 0.02) 4px
                ),
                radial-gradient(ellipse at 30% 20%, rgba(212, 175, 55, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(212, 175, 55, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
        }

        .app-container {
            position: relative;
            z-index: 2;
            max-width: 520px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--wood-light);
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: var(--gold);
            text-shadow: 0 2px 20px rgba(212, 175, 55, 0.3);
        }

        .tagline {
            font-size: 0.85rem;
            color: var(--ivory-dim);
            font-style: italic;
            letter-spacing: 0.1em;
        }

        /* Status bar */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px 16px;
            background: var(--wood-dark);
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--wood-light);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--ivory-dim);
            transition: all 0.3s ease;
        }

        .status-dot.active {
            background: var(--success);
            box-shadow: 0 0 12px var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .status-text {
            font-size: 0.9rem;
            color: var(--ivory-dim);
            letter-spacing: 0.05em;
        }

        /* Chess Board */
        .board-section {
            background: linear-gradient(145deg, var(--wood-medium), var(--wood-dark));
            border: 3px solid var(--gold-dark);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .section-title {
            font-family: 'Cinzel', serif;
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            color: var(--gold);
            text-transform: uppercase;
        }

        .turn-badge {
            font-family: 'Cinzel', serif;
            font-size: 0.7rem;
            padding: 4px 12px;
            border-radius: 12px;
            letter-spacing: 0.1em;
        }

        .turn-badge.white {
            background: var(--ivory);
            color: var(--obsidian);
        }

        .turn-badge.black {
            background: var(--obsidian);
            color: var(--ivory);
            border: 1px solid var(--ivory-dim);
        }

        .chess-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 0;
            aspect-ratio: 1;
            border: 2px solid var(--gold-dark);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .square {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: background-color 0.3s ease;
        }

        .square.light {
            background: var(--square-light);
        }

        .square.dark {
            background: var(--square-dark);
        }

        .square.highlight-from {
            background: var(--highlight-from) !important;
        }

        .square.highlight-to {
            background: var(--highlight-to) !important;
        }

        .piece {
            font-size: calc(min(100vw, 520px) / 12);
            line-height: 1;
            cursor: default;
            user-select: none;
            filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.3));
            transition: transform 0.3s ease;
            z-index: 10;
        }

        .piece.white {
            color: #fff;
            text-shadow:
                0 0 2px #000,
                0 0 2px #000,
                1px 1px 2px rgba(0,0,0,0.5);
        }

        .piece.black {
            color: #222;
            text-shadow:
                0 0 1px rgba(255,255,255,0.3);
        }

        /* Animated piece for showing best move */
        .animated-piece {
            position: absolute;
            font-size: calc(min(100vw, 520px) / 12);
            line-height: 1;
            z-index: 100;
            pointer-events: none;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.5));
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .animated-piece.white {
            color: #fff;
            text-shadow:
                0 0 2px #000,
                0 0 2px #000,
                1px 1px 2px rgba(0,0,0,0.5);
        }

        .animated-piece.black {
            color: #222;
        }

        /* Best Move Display */
        .best-move-card {
            background: linear-gradient(145deg, var(--wood-medium), var(--wood-dark));
            border: 2px solid var(--gold-dark);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .best-move-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        .move-label {
            font-family: 'Cinzel', serif;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            color: var(--gold);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .move-value {
            font-family: 'Cinzel', serif;
            font-size: 3rem;
            font-weight: 700;
            color: var(--ivory);
            text-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
            line-height: 1;
            transition: all 0.3s ease;
        }

        .move-value.highlight {
            color: var(--gold);
            transform: scale(1.05);
        }

        /* Evaluation */
        .eval-section {
            background: var(--wood-dark);
            border: 1px solid var(--wood-light);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .eval-display {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
        }

        .eval-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 500;
            color: var(--ivory);
            min-width: 70px;
        }

        .eval-value.positive { color: var(--success); }
        .eval-value.negative { color: var(--danger); }

        .eval-bar-container {
            flex: 1;
            height: 20px;
            background: var(--obsidian);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            border: 1px solid var(--wood-light);
        }

        .eval-bar-white {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            background: linear-gradient(180deg, var(--ivory) 0%, var(--ivory-dim) 100%);
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .eval-bar-center {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--gold);
            transform: translateX(-50%);
            z-index: 2;
        }

        .pv-line {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--ivory-dim);
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
        }

        /* Legal Moves */
        .moves-section {
            background: var(--wood-dark);
            border: 1px solid var(--wood-light);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .moves-list {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--ivory-dim);
            line-height: 1.8;
            max-height: 60px;
            overflow-y: auto;
        }

        .moves-list::-webkit-scrollbar {
            width: 4px;
        }

        .moves-list::-webkit-scrollbar-track {
            background: var(--wood-dark);
        }

        .moves-list::-webkit-scrollbar-thumb {
            background: var(--gold-dark);
            border-radius: 2px;
        }

        .move-count {
            color: var(--gold);
            font-weight: 600;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            flex: 1;
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(145deg, var(--gold), var(--gold-dark));
            color: var(--obsidian);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }

        .btn-secondary {
            background: var(--wood-medium);
            color: var(--ivory);
            border: 1px solid var(--wood-light);
        }

        .btn-secondary:hover {
            background: var(--wood-light);
            border-color: var(--gold-dark);
        }

        .btn-danger {
            background: linear-gradient(145deg, var(--danger), #c62828);
            color: var(--ivory);
        }

        /* Settings */
        .settings-panel {
            background: var(--wood-dark);
            border: 1px solid var(--wood-light);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--wood-light);
        }

        .setting-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .setting-label {
            font-size: 0.9rem;
            color: var(--ivory-dim);
        }

        .toggle-group {
            display: flex;
            background: var(--obsidian);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--wood-light);
        }

        .toggle-btn {
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.8rem;
            padding: 6px 14px;
            border: none;
            background: transparent;
            color: var(--ivory-dim);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .toggle-btn.active {
            background: var(--gold);
            color: var(--obsidian);
        }

        .depth-slider {
            width: 100px;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            background: var(--obsidian);
            border-radius: 3px;
            outline: none;
        }

        .depth-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: var(--gold);
            border-radius: 50%;
            cursor: pointer;
        }

        .depth-value {
            font-family: 'JetBrains Mono', monospace;
            color: var(--gold);
            margin-left: 10px;
            min-width: 20px;
        }

        /* Manual FEN */
        .fen-input-section {
            background: var(--wood-dark);
            border: 1px solid var(--wood-light);
            border-radius: 10px;
            padding: 16px;
        }

        .fen-input {
            width: 100%;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            padding: 10px;
            background: var(--obsidian);
            border: 1px solid var(--wood-light);
            border-radius: 6px;
            color: var(--ivory);
            margin-bottom: 10px;
        }

        .fen-input:focus {
            outline: none;
            border-color: var(--gold);
        }

        .fen-input::placeholder {
            color: var(--ivory-dim);
            opacity: 0.5;
        }

        /* Coordinates */
        .board-wrapper {
            position: relative;
        }

        .coords-file, .coords-rank {
            position: absolute;
            display: flex;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            color: var(--gold);
        }

        .coords-file {
            bottom: -16px;
            left: 0;
            right: 0;
            justify-content: space-around;
        }

        .coords-rank {
            top: 0;
            bottom: 0;
            left: -14px;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.4s ease forwards;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header fade-in">
            <h1 class="logo">Chess Oracle</h1>
            <p class="tagline">Wisdom from the engine</p>
        </header>

        <!-- Status Bar -->
        <div class="status-bar fade-in">
            <div class="status-dot" id="statusDot"></div>
            <span class="status-text" id="statusText">Initializing...</span>
        </div>

        <!-- Chess Board -->
        <div class="board-section fade-in">
            <div class="board-header">
                <div class="section-title">Detected Position</div>
                <div class="turn-badge white" id="turnBadge">White</div>
            </div>
            <div class="board-wrapper">
                <div class="chess-board" id="chessBoard"></div>
                <div class="coords-file">
                    <span>a</span><span>b</span><span>c</span><span>d</span>
                    <span>e</span><span>f</span><span>g</span><span>h</span>
                </div>
                <div class="coords-rank">
                    <span>8</span><span>7</span><span>6</span><span>5</span>
                    <span>4</span><span>3</span><span>2</span><span>1</span>
                </div>
            </div>
        </div>

        <!-- Best Move Card -->
        <div class="best-move-card fade-in">
            <div class="move-label">Best Move</div>
            <div class="move-value" id="bestMove">--</div>
        </div>

        <!-- Evaluation -->
        <div class="eval-section fade-in">
            <div class="section-title">Evaluation</div>
            <div class="eval-display">
                <div class="eval-value" id="evalValue">0.00</div>
                <div class="eval-bar-container">
                    <div class="eval-bar-white" id="evalBar" style="width: 50%"></div>
                    <div class="eval-bar-center"></div>
                </div>
            </div>
            <div class="pv-line" id="pvLine">Waiting for position...</div>
        </div>

        <!-- Legal Moves -->
        <div class="moves-section fade-in">
            <div class="section-title">Legal Moves</div>
            <div class="moves-list" id="movesList">
                <span class="move-count">0</span> moves available
            </div>
        </div>

        <!-- Controls -->
        <div class="controls fade-in">
            <button class="btn btn-secondary" onclick="selectBoard()">Select Board</button>
            <button class="btn btn-primary" id="watchBtn" onclick="toggleWatch()">Start Watching</button>
            <button class="btn btn-secondary" onclick="saveDebug()">Debug</button>
        </div>

        <!-- Settings -->
        <div class="settings-panel fade-in">
            <div class="section-title" style="margin-bottom: 10px;">Settings</div>
            <div class="setting-row">
                <span class="setting-label">Playing as</span>
                <div class="toggle-group">
                    <button class="toggle-btn active" id="whiteBtn" onclick="setColor('white')">White</button>
                    <button class="toggle-btn" id="blackBtn" onclick="setColor('black')">Black</button>
                </div>
            </div>
            <div class="setting-row">
                <span class="setting-label">Depth</span>
                <div style="display: flex; align-items: center;">
                    <input type="range" class="depth-slider" id="depthSlider" min="5" max="25" value="15" onchange="setDepth(this.value)">
                    <span class="depth-value" id="depthValue">15</span>
                </div>
            </div>
        </div>

        <!-- Manual FEN -->
        <div class="fen-input-section fade-in">
            <div class="section-title" style="margin-bottom: 10px;">Manual Analysis</div>
            <input type="text" class="fen-input" id="fenInput" placeholder="Paste FEN string here...">
            <button class="btn btn-secondary" style="width: 100%;" onclick="analyzeFen()">Analyze</button>
        </div>
    </div>

    <script>
        // Chess piece unicode symbols
        const PIECES = {
            'K': '♔', 'Q': '♕', 'R': '♖', 'B': '♗', 'N': '♘', 'P': '♙',
            'k': '♚', 'q': '♛', 'r': '♜', 'b': '♝', 'n': '♞', 'p': '♟'
        };

        let isWatching = false;
        let pollInterval = null;
        let currentFen = null;
        let lastBestMove = null;
        let boardFlipped = false;

        // Initialize the board
        function initBoard() {
            const board = document.getElementById('chessBoard');
            board.innerHTML = '';

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const square = document.createElement('div');
                    square.className = `square ${(row + col) % 2 === 0 ? 'light' : 'dark'}`;
                    square.dataset.row = row;
                    square.dataset.col = col;
                    square.dataset.square = String.fromCharCode(97 + col) + (8 - row);
                    board.appendChild(square);
                }
            }
            updateBoardOrientation();
        }

        // Update board orientation based on playing color
        function updateBoardOrientation() {
            const board = document.getElementById('chessBoard');
            const coordsFile = document.querySelector('.coords-file');
            const coordsRank = document.querySelector('.coords-rank');

            if (boardFlipped) {
                // Playing as Black - flip the board
                board.style.transform = 'rotate(180deg)';
                // Flip pieces back so they're right-side up
                board.querySelectorAll('.piece').forEach(p => p.style.transform = 'rotate(180deg)');
                // Update coordinates for Black's view
                coordsFile.innerHTML = '<span>h</span><span>g</span><span>f</span><span>e</span><span>d</span><span>c</span><span>b</span><span>a</span>';
                coordsRank.innerHTML = '<span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span>';
            } else {
                // Playing as White - normal orientation
                board.style.transform = 'none';
                board.querySelectorAll('.piece').forEach(p => p.style.transform = 'none');
                coordsFile.innerHTML = '<span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span><span>g</span><span>h</span>';
                coordsRank.innerHTML = '<span>8</span><span>7</span><span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span>';
            }
        }

        // Parse FEN and update board
        function updateBoardFromFen(fen) {
            if (!fen) return;

            const board = document.getElementById('chessBoard');
            const squares = board.querySelectorAll('.square');

            // Clear all pieces and highlights
            squares.forEach(sq => {
                sq.innerHTML = '';
                sq.classList.remove('highlight-from', 'highlight-to');
            });

            // Parse FEN
            const fenParts = fen.split(' ');
            const position = fenParts[0];
            const rows = position.split('/');

            let squareIndex = 0;
            for (const row of rows) {
                for (const char of row) {
                    if (char >= '1' && char <= '8') {
                        squareIndex += parseInt(char);
                    } else {
                        const square = squares[squareIndex];
                        if (square && PIECES[char]) {
                            const piece = document.createElement('span');
                            piece.className = `piece ${char === char.toUpperCase() ? 'white' : 'black'}`;
                            piece.textContent = PIECES[char];
                            piece.dataset.piece = char;
                            // Flip piece if board is flipped so it's right-side up
                            if (boardFlipped) {
                                piece.style.transform = 'rotate(180deg)';
                            }
                            square.appendChild(piece);
                        }
                        squareIndex++;
                    }
                }
            }

            // Update turn badge
            const turn = fenParts[1] || 'w';
            const turnBadge = document.getElementById('turnBadge');
            turnBadge.textContent = turn === 'w' ? 'White' : 'Black';
            turnBadge.className = `turn-badge ${turn === 'w' ? 'white' : 'black'}`;
        }

        // Animate best move on board
        function animateBestMove(moveUci, fen) {
            if (!moveUci || moveUci.length < 4) return;

            const fromSquare = moveUci.substring(0, 2);
            const toSquare = moveUci.substring(2, 4);

            const board = document.getElementById('chessBoard');
            const squares = board.querySelectorAll('.square');

            // Find squares
            let fromEl = null, toEl = null;
            squares.forEach(sq => {
                if (sq.dataset.square === fromSquare) fromEl = sq;
                if (sq.dataset.square === toSquare) toEl = sq;
            });

            if (!fromEl || !toEl) return;

            // Highlight squares
            squares.forEach(sq => sq.classList.remove('highlight-from', 'highlight-to'));
            fromEl.classList.add('highlight-from');
            toEl.classList.add('highlight-to');

            // Get piece from source square
            const pieceEl = fromEl.querySelector('.piece');
            if (!pieceEl) return;

            // Create animated piece
            const animPiece = document.createElement('span');
            animPiece.className = `animated-piece ${pieceEl.classList.contains('white') ? 'white' : 'black'}`;
            animPiece.textContent = pieceEl.textContent;

            // Get positions
            const boardRect = board.getBoundingClientRect();
            const fromRect = fromEl.getBoundingClientRect();
            const toRect = toEl.getBoundingClientRect();

            // Set initial position
            animPiece.style.left = (fromRect.left - boardRect.left + fromRect.width/2) + 'px';
            animPiece.style.top = (fromRect.top - boardRect.top + fromRect.height/2) + 'px';
            animPiece.style.transform = 'translate(-50%, -50%)';

            board.appendChild(animPiece);

            // Hide original piece
            pieceEl.style.opacity = '0';

            // Animate to destination
            requestAnimationFrame(() => {
                animPiece.style.left = (toRect.left - boardRect.left + toRect.width/2) + 'px';
                animPiece.style.top = (toRect.top - boardRect.top + toRect.height/2) + 'px';
            });

            // Clean up after animation
            setTimeout(() => {
                animPiece.remove();
                pieceEl.style.opacity = '1';
            }, 500);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initBoard();
            checkStatus();
            setInterval(checkStatus, 2000);
        });

        async function checkStatus() {
            try {
                const res = await fetch('/api/status');
                const status = await res.json();

                if (!status.stockfish_ready) {
                    document.getElementById('statusText').textContent = 'Stockfish not found';
                } else if (!status.board_selected) {
                    document.getElementById('statusText').textContent = 'Select board region';
                } else if (status.running) {
                    document.getElementById('statusText').textContent = 'Watching...';
                    document.getElementById('statusDot').classList.add('active');
                    document.getElementById('watchBtn').textContent = 'Stop';
                    document.getElementById('watchBtn').classList.remove('btn-primary');
                    document.getElementById('watchBtn').classList.add('btn-danger');
                    isWatching = true;
                    if (!pollInterval) {
                        pollInterval = setInterval(pollAnalysis, 500);
                    }
                } else {
                    document.getElementById('statusText').textContent = 'Ready';
                    document.getElementById('statusDot').classList.remove('active');
                    document.getElementById('watchBtn').textContent = 'Start Watching';
                    document.getElementById('watchBtn').classList.add('btn-primary');
                    document.getElementById('watchBtn').classList.remove('btn-danger');
                    isWatching = false;
                    if (pollInterval) {
                        clearInterval(pollInterval);
                        pollInterval = null;
                    }
                }

                if (status.playing_as === 'black') {
                    document.getElementById('blackBtn').classList.add('active');
                    document.getElementById('whiteBtn').classList.remove('active');
                    if (!boardFlipped) {
                        boardFlipped = true;
                        updateBoardOrientation();
                    }
                } else {
                    document.getElementById('whiteBtn').classList.add('active');
                    document.getElementById('blackBtn').classList.remove('active');
                    if (boardFlipped) {
                        boardFlipped = false;
                        updateBoardOrientation();
                    }
                }
                document.getElementById('depthSlider').value = status.depth;
                document.getElementById('depthValue').textContent = status.depth;

            } catch (e) {
                console.error('Status check failed:', e);
            }
        }

        async function pollAnalysis() {
            try {
                const res = await fetch('/api/analysis');
                const data = await res.json();
                updateUI(data);
            } catch (e) {
                console.error('Poll failed:', e);
            }
        }

        function updateUI(data) {
            // Always update FEN display if available (even with errors)
            const detectedFen = data.detected_fen || data.fen;
            if (detectedFen && detectedFen !== currentFen) {
                currentFen = detectedFen;
                updateBoardFromFen(detectedFen);
            }

            if (data.error) {
                document.getElementById('statusText').textContent = data.error;
                // Still show the FEN for debugging
                if (detectedFen) {
                    document.getElementById('pvLine').textContent = 'FEN: ' + detectedFen;
                }
                return;
            }

            // Update board if FEN changed
            if (data.fen && data.fen !== currentFen) {
                currentFen = data.fen;
                updateBoardFromFen(data.fen);
            }

            // Best move - only show when it's the user's turn
            const moveEl = document.getElementById('bestMove');
            const moveLabel = document.querySelector('.move-label');

            if (data.is_user_turn === false) {
                // Opponent's turn - show waiting message
                moveEl.textContent = '...';
                moveEl.classList.remove('highlight');
                moveLabel.textContent = "Opponent's Turn";
                lastBestMove = null;
            } else {
                // User's turn - show best move
                const newMove = data.best_move || '--';
                moveLabel.textContent = `Your Move (${data.user_color || 'Black'})`;

                if (moveEl.textContent !== newMove) {
                    moveEl.textContent = newMove;
                    moveEl.classList.add('highlight');
                    setTimeout(() => moveEl.classList.remove('highlight'), 300);

                    // Animate the move on board
                    if (data.best_move_uci && data.best_move_uci !== lastBestMove) {
                        lastBestMove = data.best_move_uci;
                        animateBestMove(data.best_move_uci, data.fen);
                    }
                }
            }

            // Evaluation
            const evalEl = document.getElementById('evalValue');
            evalEl.textContent = data.evaluation || '0.00';
            evalEl.className = 'eval-value';
            if (data.eval_cp > 50) evalEl.classList.add('positive');
            else if (data.eval_cp < -50) evalEl.classList.add('negative');

            const evalCp = data.eval_cp || 0;
            const clamped = Math.max(-1000, Math.min(1000, evalCp));
            const whitePct = ((clamped + 1000) / 2000) * 100;
            document.getElementById('evalBar').style.width = `${whitePct}%`;

            // PV
            document.getElementById('pvLine').textContent = data.pv || 'Waiting for position...';

            // Legal moves
            const moves = data.legal_moves || [];
            if (moves.length > 0) {
                const display = moves.slice(0, 12).join(', ');
                const extra = moves.length > 12 ? ` +${moves.length - 12} more` : '';
                document.getElementById('movesList').innerHTML =
                    `<span class="move-count">${moves.length}</span> moves: ${display}${extra}`;
            } else {
                document.getElementById('movesList').innerHTML =
                    '<span class="move-count">0</span> moves available';
            }
        }

        async function selectBoard() {
            document.getElementById('statusText').textContent = 'Click and drag to select...';
            await fetch('/api/select-board', { method: 'POST' });
        }

        async function toggleWatch() {
            if (isWatching) {
                await fetch('/api/stop', { method: 'POST' });
            } else {
                const res = await fetch('/api/start', { method: 'POST' });
                const data = await res.json();
                if (data.error) alert(data.error);
            }
            checkStatus();
        }

        async function setColor(color) {
            await fetch('/api/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ playing_as: color })
            });
            checkStatus();
        }

        async function setDepth(value) {
            document.getElementById('depthValue').textContent = value;
            await fetch('/api/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ depth: parseInt(value) })
            });
        }

        async function analyzeFen() {
            const fen = document.getElementById('fenInput').value.trim();
            if (!fen) {
                alert('Please enter a FEN string');
                return;
            }

            document.getElementById('statusText').textContent = 'Analyzing...';

            const res = await fetch('/api/analyze-fen', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fen })
            });

            const data = await res.json();
            if (data.error) {
                alert(data.error);
            } else {
                updateUI(data);
            }

            document.getElementById('statusText').textContent = 'Analysis complete';
        }

        async function saveDebug() {
            document.getElementById('statusText').textContent = 'Saving debug info...';
            const res = await fetch('/api/debug', { method: 'POST' });
            const data = await res.json();
            if (data.error) {
                alert(data.error);
            } else {
                alert('Debug saved to Desktop:\\n' + data.path + '\\n\\nDetected FEN:\\n' + data.fen);
            }
            document.getElementById('statusText').textContent = 'Debug saved';
        }
    </script>
</body>
</html>
